name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Debug and Find Build File
        run: |
          echo "=== Listing Repository Files ==="
          find . -maxdepth 3 -not -path '*/.*'

          # البحث عن ملف بناء أندرويد الحقيقي
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | grep -v "build/" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
            echo "Found build file at: $BUILD_FILE"
            echo "Changing directory to: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "Warning: No build.gradle found, staying in root."
          fi

          # إعداد Gradle Wrapper والبناء
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          
