name: Build Android APK Automatically

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Auto-Generate Android Project Structure
        run: |
          if [ ! -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
            echo "جاري إنشاء هيكل مشروع أندرويد تلقائياً..."
            mkdir -p app/src/main/java/com/hasan/sportsapp
            mkdir -p app/src/main/res/values

            # نقل أي ملفات كوتلن موجودة في المستودع إلى مسار المشروع
            find . -maxdepth 2 -name "*.kt" -not -path "./app/*" -exec cp {} app/src/main/java/com/hasan/sportsapp/ \; 2>/dev/null || true

            # إذا لم تكن هناك ملفات كوتلن، سننشئ واجهة رئيسية افتراضية لكي يبدأ التطبيق بنجاح
            if [ ! -f "app/src/main/java/com/hasan/sportsapp/MainActivity.kt" ]; then
              cat << 'EOF' > app/src/main/java/com/hasan/sportsapp/MainActivity.kt
              package com.hasan.sportsapp
              import android.app.Activity
              import android.os.Bundle
              import android.widget.TextView
              class MainActivity : Activity() {
                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      val tv = TextView(this)
                      tv.text = "تطبيق الرياضة يعمل بنجاح!"
                      setContentView(tv)
                  }
              }
EOF
            fi

            # إنشاء ملف AndroidManifest.xml
            cat << 'EOF' > app/src/main/AndroidManifest.xml
            <manifest xmlns:android="http://schemas.android.com/apk/res/android"
                package="com.hasan.sportsapp">
                <application
                    android:allowBackup="true"
                    android:label="Sports App"
                    android:supportsRtl="true"
                    android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                    <activity
                        android:name=".MainActivity"
                        android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
EOF

            # إنشاء إعدادات المشروع settings.gradle
            cat << 'EOF' > settings.gradle
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "SportsApp"
            include ':app'
EOF

            # إنشاء ملف البناء الرئيسي build.gradle
            cat << 'EOF' > build.gradle
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath "com.android.tools.build:gradle:7.4.2"
                    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            task clean(type: Delete) {
                delete rootProject.buildDir
            }
EOF

            # إنشاء ملف البناء لتطبيق الأندرويد app/build.gradle
            cat << 'EOF' > app/build.gradle
            plugins {
                id 'com.android.application'
                id 'org.jetbrains.kotlin.android'
            }
            android {
                namespace 'com.hasan.sportsapp'
                compileSdk 33
                defaultConfig {
                    applicationId "com.hasan.sportsapp"
                    minSdk 21
                    targetSdk 33
                    versionCode 1
                    versionName "1.0"
                }
                buildTypes {
                    release {
                        minifyEnabled false
                    }
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = '17'
                }
            }
            dependencies {
                implementation 'androidx.core:core-ktx:1.9.0'
            }
EOF
          fi

      - name: Build Debug APK
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.0
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          
