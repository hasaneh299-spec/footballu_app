name: Build Android APK Automatically

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Advanced Sports App Code
        run: |
          mkdir -p app/src/main/java/com/hasan/sportsapp
          mkdir -p app/src/main/res/values

          cat << 'EOF' > app/src/main/java/com/hasan/sportsapp/MainActivity.kt
          package com.hasan.sportsapp

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scrollView = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#121212"))
                      setPadding(24, 24, 24, 24)
                  }

                  val mainLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val title = TextView(this).apply {
                      text = "⚽ فيوت بول نيوز - المباريات المباشرة"
                      textSize = 20f
                      setTextColor(Color.parseColor("#00E676"))
                      setPadding(0, 0, 0, 32)
                      gravity = Gravity.CENTER
                  }
                  mainLayout.addView(title)

                  val matchCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                      setPadding(32, 32, 32, 32)
                  }

                  val matchTitle = TextView(this).apply {
                      text = "دوري أبطال أوروبا | النهائي المرتقب"
                      textSize = 14f
                      setTextColor(Color.parseColor("#B0BEC5"))
                      setPadding(0, 0, 0, 16)
                  }
                  matchCard.addView(matchTitle)

                  val teamsScore = TextView(this).apply {
                      text = "Real Madrid   2 - 1   Barcelona\n⏱️ الدقيقة 78 (الشوط الثاني)"
                      textSize = 18f
                      setTextColor(Color.parseColor("#FFFFFF"))
                      gravity = Gravity.CENTER
                  }
                  matchCard.addView(teamsScore)
                  mainLayout.addView(matchCard)

                  val spacer = TextView(this).apply {
                      text = "\n\n📊 جدول ترتيب الدوري الإسباني"
                      textSize = 18f
                      setTextColor(Color.parseColor("#FFD700"))
                      setPadding(0, 24, 0, 16)
                  }
                  mainLayout.addView(spacer)

                  val standingsCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                      setPadding(24, 24, 24, 24)
                  }

                  val tableContent = TextView(this).apply {
                      text = "1. Real Madrid  -  54 Pts\n2. Barcelona      -  49 Pts\n3. Atletico Madrid - 42 Pts"
                      textSize = 15f
                      setTextColor(Color.parseColor("#E0E0E0"))
                  }
                  standingsCard.addView(tableContent)
                  mainLayout.addView(standingsCard)

                  scrollView.addView(mainLayout)
                  setContentView(scrollView)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.hasan.sportsapp">
              <application
                  android:allowBackup="true"
                  android:label="Football News"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "footballu_app"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:7.4.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.hasan.sportsapp'
              compileSdk 33
              defaultConfig {
                  applicationId 'com.hasan.sportsapp'
                  minSdk 21
                  targetSdk 33
                  versionCode 2
                  versionName "1.1"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 7.5

      - name: Build Fresh APK Cleanly
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --rerun-tasks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
