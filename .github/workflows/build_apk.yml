name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Find Project Directory and Build
        run: |
          # البحث تلقائياً عن المجلد الذي يحتوي على إعدادات أندرويد
          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            # إذا لم يوجد، ابحث عن ملفات المشروع العادية
            PROJECT_DIR="."
          fi
          echo "Using project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # إعداد Gradle Wrapper في مجلد المشروع وبناء التطبيق
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          
