name: Build Android APK Automatically

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Auto-Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/hasan/sportsapp
          mkdir -p app/src/main/res/values
          
          printf 'package com.hasan.sportsapp\nimport android.app.Activity\nimport android.os.Bundle\nimport android.widget.TextView\nclass MainActivity : Activity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        val tv = TextView(this)\n        tv.text = "تطبيق الرياضة يعمل بنجاح!"\n        setContentView(tv)\n    }\n}' > app/src/main/java/com/hasan/sportsapp/MainActivity.kt

          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    package="com.hasan.sportsapp">\n    <application\n        android:allowBackup="true"\n        android:label="Sports App"\n        android:supportsRtl="true"\n        android:theme="@android:style/Theme.DeviceDefault.NoActionBar">\n        <activity\n            android:name=".MainActivity"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>' > app/src/main/AndroidManifest.xml

          printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = "SportsApp"\ninclude \x27:app\x27' > settings.gradle

          printf 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath "com.android.tools.build:gradle:7.4.2"\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\ntask clean(type: Delete) {\n    delete rootProject.buildDir\n}' > build.gradle

          printf 'plugins {\n    id \x27com.android.application\x27\n    id \x27org.jetbrains.kotlin.android\x27\n}\nandroid {\n    namespace \x27com.hasan.sportsapp\x27\n    compileSdk 33\n    defaultConfig {\n        applicationId \x27com.hasan.sportsapp\x27\n        minSdk 21\n        targetSdk 33\n        versionCode 1\n        versionName "1.0"\n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n        }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = \x2717\x27\n    }\n}\ndependencies {\n    implementation \x27androidx.core:core-ktx:1.9.0\x27\n}' > app/build.gradle

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          
