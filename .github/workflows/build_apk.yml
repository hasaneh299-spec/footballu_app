name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Repository Files
        run: |
          echo "========================================"
          echo "    ملفات المستودع الحالية بالكامل:"
          echo "========================================"
          find . -maxdepth 3 -not -path '*/.*'
          echo "========================================"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Try to Build if Gradle exists
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ] || [ -f "app/build.gradle" ]; then
            if [ ! -f "gradlew" ]; then
              gradle wrapper --gradle-version 8.5
            fi
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "تنبيه: لا يوجد ملف build.gradle في المستودع. تأكد من رفع ملفات مشروع أندرويد كاملاً (وليس ملفات كوتلن منفردة فقط)."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
          
